image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/arch-labs.png
name: Arch Labs
description: >-
  Arch (Arch Labs, Inc.) is a private-markets infrastructure platform that centralizes the administration
  of alternative investments for individual investors, wealth managers, family offices, institutional
  allocators, CPAs, fund managers and their advisors. Acting as a "portal of portals," Arch collects and
  classifies investment correspondence, parses account statements and cash flows, automates capital-call
  and distribution workflows, tracks tax-document deadlines, and produces standardized portfolio views
  and AI-generated manager-update summaries across private credit, real estate, venture capital, hedge
  funds and private equity. Its Client API exposes holdings, investing/issuing entities, activities,
  cash flows, tasks, tax documents, user roles and Addepar exports, and it integrates with Addepar,
  Salesforce and Bipsync. Backed by Craft Ventures, Menlo Ventures, Oak HC/FT and others.
